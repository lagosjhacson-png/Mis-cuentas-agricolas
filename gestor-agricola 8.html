<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Gestor Agrícola"/>
  <title>🌱 Gestor Agrícola</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#F0F7EE;font-family:-apple-system,'Segoe UI',sans-serif;}
    input,button{font-family:inherit;}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect} = React;

const CULTIVOS=[
  {id:"maiz",     nombre:"Maíz",     emoji:"🌽",color:"#F5A623"},
  {id:"frijoles", nombre:"Frijoles", emoji:"🫘",color:"#8B4513"},
  {id:"tomate",   nombre:"Tomate",   emoji:"🍅",color:"#E74C3C"},
  {id:"chiltoma", nombre:"Chiltoma", emoji:"🫑",color:"#2ECC71"},
  {id:"papa",     nombre:"Papa",     emoji:"🥔",color:"#D4AC0D"},
  {id:"cebolla",  nombre:"Cebolla",  emoji:"🧅",color:"#9B59B6"},
];
const SOCIOS=["Jhacson","Harol"];
const LSKEY="ga_gastos_v3";
const LSTKEY="ga_tareas_v1";
const LSDKEY="ga_deudas_v1";
const LSPKEY="ga_pagados_v1";
const LSCKEY="ga_ciclos_v1";

const fmt=(n)=>"C$ "+Number(n||0).toLocaleString("es-NI",{minimumFractionDigits:2,maximumFractionDigits:2});
const load=()=>{try{const r=localStorage.getItem(LSKEY);return r?JSON.parse(r):[];}catch{return[];}};
const save=(d)=>{try{localStorage.setItem(LSKEY,JSON.stringify(d));}catch{}};

function App(){
  const [gastos,setGastos]      = useState(load);
  const [tareas,setTareas]      = useState(()=>{try{const r=localStorage.getItem(LSTKEY);return r?JSON.parse(r):[];}catch{return[];}});
  const saveTareas=(t)=>{try{localStorage.setItem(LSTKEY,JSON.stringify(t));}catch{}};
  const updTareas=(t)=>{setTareas(t);saveTareas(t);};

  const [deudas,setDeudas]      = useState(()=>{try{const r=localStorage.getItem(LSDKEY);return r?JSON.parse(r):[];}catch{return[];}});
  const [pagados,setPagados]    = useState(()=>{try{const r=localStorage.getItem(LSPKEY);return r?JSON.parse(r):[];}catch{return[];}});
  const updDeudas=(d)=>{setDeudas(d);try{localStorage.setItem(LSDKEY,JSON.stringify(d));}catch{}};
  const updPagados=(p)=>{setPagados(p);try{localStorage.setItem(LSPKEY,JSON.stringify(p));}catch{}};

  // CICLOS: {id, cultivoId, nombre, fechaInicio, activo}
  const [ciclos,setCiclos] = useState(()=>{
    try{const r=localStorage.getItem(LSCKEY);return r?JSON.parse(r):[];}catch{return[];}
  });
  const updCiclos=(c)=>{setCiclos(c);try{localStorage.setItem(LSCKEY,JSON.stringify(c));}catch{}};

  const [tipoCambio,setTipoCambio]= useState(()=>{try{return parseFloat(localStorage.getItem("ga_tc")||"36.50");}catch{return 36.50;}});
  const saveTipoCambio=(v)=>{setTipoCambio(v);try{localStorage.setItem("ga_tc",String(v));}catch{}};
  const [nuevaDeuda,setNuevaDeuda]= useState({descripcion:"",monto:"",moneda:"COR",persona:"Mamá"});
  const [abonoMoneda,setAbonoMoneda]= useState({});
  const [verPagados,setVerPagados]= useState(false);
  const [mostrarFormDeuda,setMostrarFormDeuda]= useState(false);
  const [filtroPersona,setFiltroPersona]= useState("todos");
  const [abonoDeuda,setAbonoDeuda]= useState({});
  const [vista,setVista]        = useState("inicio");
  const [cultivoSel,setCultivo] = useState(CULTIVOS[0].id);
  const [cicloSel,setCicloSel]  = useState(null); // id del ciclo seleccionado al agregar
  const [socioSel,setSocio]     = useState("Harol");
  const [desc,setDesc]          = useState("");
  const [monto,setMonto]        = useState("");
  const [escaneando,setEsc]     = useState(false);
  const [msgIA,setMsgIA]        = useState("");
  const [filtro,setFiltro]      = useState("todos");
  const [filtroCiclo,setFiltroCiclo] = useState("todos");
  const [filtroSocio,setFiltroSocio] = useState("todos");
  const [busqueda,setBusqueda]  = useState("");
  const [confirmar,setConfirmar]= useState(null);
  const [expandido,setExpandido]= useState(null);
  const [flash,setFlash]        = useState("");
  const [apiKey,setApiKey]      = useState(()=>{try{return localStorage.getItem("ga_ak")||"";}catch{return"";}});
  const [verKey,setVerKey]      = useState(false);
  const [editando,setEditando]  = useState(null);
  const [importMsg,setImportMsg]= useState("");
  const [nuevaTarea,setNuevaTarea]= useState({titulo:"",fecha:"",categoria:"finca",notas:""});
  const [mostrarFormTarea,setMostrarFormTarea]= useState(false);
  const [mostrarFormCiclo,setMostrarFormCiclo]= useState(false);
  const [nuevoCiclo,setNuevoCiclo]= useState({cultivoId:"papa",nombre:""});
  const camRef = useRef();
  const galRef = useRef();
  const importRef = useRef();

  const ok=(msg)=>{setFlash(msg);setTimeout(()=>setFlash(""),2200);};
  const upd=(nuevos)=>{setGastos(nuevos);save(nuevos);};

  // Obtener nombre del ciclo para un gasto
  const nombreCiclo=(g)=>{
    if(!g.cicloId)return null;
    const c=ciclos.find(x=>x.id===g.cicloId);
    return c?c.nombre:null;
  };

  // Ciclos activos de un cultivo
  const ciclosDeCultivo=(cultivoId)=>ciclos.filter(c=>c.cultivoId===cultivoId&&c.activo!==false);

  const agregar=()=>{
    if(!monto||isNaN(parseFloat(monto)))return;
    const g={id:Date.now(),cultivo:cultivoSel,socio:socioSel,
      descripcion:desc||"Sin descripción",monto:parseFloat(monto),fecha:new Date().toISOString(),
      cicloId:cicloSel||null};
    upd([g,...gastos]);
    setMonto("");setDesc("");setMsgIA("");
    ok("✅ Gasto guardado");setVista("inicio");
  };

  const borrar=(id)=>upd(gastos.filter(g=>g.id!==id));

  const borrarCiclo=(cid)=>{
    // Si es un ciclo personalizado, borrar gastos de ese ciclo
    if(cid.startsWith("ciclo_")){
      const cicloId=parseInt(cid.replace("ciclo_",""));
      upd(gastos.filter(g=>g.cicloId!==cicloId));
      updCiclos(ciclos.filter(c=>c.id!==cicloId));
    }else{
      // Cultivo base (sin ciclo)
      upd(gastos.filter(g=>g.cultivo!==cid||g.cicloId));
    }
    setConfirmar(null);ok("✅ Ciclo eliminado");
  };

  const abrirEditar=(g)=>{
    setEditando({...g, montoStr:String(g.monto)});
    setVista("editar");
  };

  const guardarEdicion=()=>{
    if(!editando||!editando.montoStr||isNaN(parseFloat(editando.montoStr)))return;
    const actualizado={...editando, monto:parseFloat(editando.montoStr)};
    delete actualizado.montoStr;
    upd(gastos.map(g=>g.id===actualizado.id?actualizado:g));
    setEditando(null);
    ok("✅ Gasto actualizado");
    setVista("historial");
  };

  const escanear=async(file)=>{
    if(!file)return;
    if(!apiKey){setMsgIA("⚙️ Agrega tu API Key en Ajustes para escanear.");return;}
    setEsc(true);setMsgIA("Leyendo factura...");
    try{
      const b64=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result.split(",")[1]);
        r.onerror=rej;
        r.readAsDataURL(file);
      });
      const resp=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":apiKey,
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true"
        },
        body:JSON.stringify({
          model:"claude-sonnet-4-6",max_tokens:300,
          messages:[{role:"user",content:[
            {type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:b64}},
            {type:"text",text:`Analiza esta factura agrícola de Nicaragua o Colombia.
Responde SOLO con JSON sin backticks:
{"monto":1500.00,"descripcion":"Semillas maíz"}
Suma todos los items para el total. Si no hay monto usa 0. Descripción máx 35 caracteres.`}
          ]}]
        })
      });
      const data=await resp.json();
      const txt=(data.content||[]).map(i=>i.text||"").join("").replace(/```json|```/g,"").trim();
      const p=JSON.parse(txt);
      if(p.monto>0){setMonto(String(p.monto));setDesc(p.descripcion||"");setMsgIA("✅ Leído: "+fmt(p.monto));}
      else setMsgIA("⚠️ No encontré monto. Ingrésalo manualmente.");
    }catch{setMsgIA("❌ Error. Verifica tu API Key en Ajustes.");}
    finally{setEsc(false);}
  };

  const exportarJSON=()=>{
    const fechaStr=new Date().toLocaleDateString("es-NI",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"-");
    const datos={version:1,fecha:new Date().toISOString(),gastos,ciclos};
    const json=JSON.stringify(datos,null,2);
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`agricultura-${fechaStr}.json`;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    ok("✅ JSON exportado");
  };

  const exportarTXT=()=>{
    const fechaStr=new Date().toLocaleDateString("es-NI",{year:"numeric",month:"2-digit",day:"2-digit"}).replace(/\//g,"-");
    const fechaLeg=new Date().toLocaleDateString("es-NI",{day:"2-digit",month:"long",year:"numeric"});
    const totJ=gastos.filter(g=>g.socio==="Jhacson").reduce((a,g)=>a+g.monto,0);
    const totH=gastos.filter(g=>g.socio==="Harol").reduce((a,g)=>a+g.monto,0);
    const totT=gastos.reduce((a,g)=>a+g.monto,0);
    let txt=`╔══════════════════════════════╗\n║   GESTOR AGRÍCOLA            ║\n║   Jhacson & Harol            ║\n╚══════════════════════════════╝\n`;
    txt+=`Exportado: ${fechaLeg}\nTotal registros: ${gastos.length}\n\n`;
    txt+=`══ RESUMEN GENERAL ══\nJhacson:  ${fmt(totJ)}\nHarol:    ${fmt(totH)}\nTOTAL:    ${fmt(totT)}\n\n`;
    CULTIVOS.forEach(c=>{
      const gs=gastos.filter(g=>g.cultivo===c.id);
      if(!gs.length)return;
      const t=gs.reduce((a,g)=>a+g.monto,0);
      const j=gs.filter(g=>g.socio==="Jhacson").reduce((a,g)=>a+g.monto,0);
      const h=gs.filter(g=>g.socio==="Harol").reduce((a,g)=>a+g.monto,0);
      txt+=`══ ${c.emoji} ${c.nombre.toUpperCase()} — ${fmt(t)} ══\n   Jhacson: ${fmt(j)} | Harol: ${fmt(h)}\n`;
      gs.forEach(g=>{
        const fecha=new Date(g.fecha).toLocaleDateString("es-NI",{day:"2-digit",month:"short",year:"numeric"});
        const nc=nombreCiclo(g);
        txt+=`   • ${g.descripcion}${nc?` [${nc}]`:""}\n     ${g.socio} — ${fmt(g.monto)} — ${fecha}\n`;
      });
      txt+=`\n`;
    });
    txt+=`══════════════════════════════\nArchivo generado por Gestor Agrícola\n`;
    const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`agricultura-${fechaStr}.txt`;
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);URL.revokeObjectURL(url);
    ok("✅ TXT exportado");
  };

  const importar=(file)=>{
    if(!file)return;
    const r=new FileReader();
    r.onload=e=>{
      try{
        const datos=JSON.parse(e.target.result);
        if(!datos.gastos||!Array.isArray(datos.gastos))throw new Error("Formato inválido");
        upd(datos.gastos);
        if(datos.ciclos)updCiclos(datos.ciclos);
        setImportMsg("✅ "+datos.gastos.length+" registros restaurados correctamente.");
      }catch{setImportMsg("❌ Archivo inválido. Usa solo archivos exportados de esta app.");}
    };
    r.readAsText(file);
    importRef.current.value="";
  };

  const totSocio=(s)=>gastos.filter(g=>g.socio===s).reduce((a,g)=>a+g.monto,0);
  const total=gastos.reduce((a,g)=>a+g.monto,0);
  const filtrados=gastos
    .filter(g=>filtro==="todos"||g.cultivo===filtro)
    .filter(g=>filtroSocio==="todos"||g.socio===filtroSocio)
    .filter(g=>filtroCiclo==="todos"||(filtroCiclo==="base"?!g.cicloId:g.cicloId===parseInt(filtroCiclo)))
    .filter(g=>busqueda===""||g.descripcion.toLowerCase().includes(busqueda.toLowerCase()));
  const cul=(id)=>CULTIVOS.find(c=>c.id===id)||CULTIVOS[0];
  const card={background:"#fff",borderRadius:14,padding:16,boxShadow:"0 2px 8px rgba(0,0,0,.07)",marginBottom:12};

  const navItems=[
    ["inicio","🏠","Inicio"],
    ["agregar","➕","Agregar"],
    ["historial","📋","Historial"],
    ["tareas","📅","Tareas"],
    ["deudas","💰","Deudas"],
    ["resumen","📊","Resumen"],
    ["ajustes","⚙️","Ajustes"]
  ];

  // Construir grupos para pantalla inicio y resumen (cultivo base + ciclos)
  const gruposInicio=()=>{
    const grupos=[];
    CULTIVOS.forEach(c=>{
      // Gastos sin ciclo de este cultivo
      const base=gastos.filter(g=>g.cultivo===c.id&&!g.cicloId);
      if(base.length>0)grupos.push({key:c.id,cultivo:c,cicloId:null,nombre:c.nombre,gastos:base});
      // Ciclos de este cultivo
      ciclos.filter(ci=>ci.cultivoId===c.id&&ci.activo!==false).forEach(ci=>{
        const gs=gastos.filter(g=>g.cultivo===c.id&&g.cicloId===ci.id);
        if(gs.length>0)grupos.push({key:`ciclo_${ci.id}`,cultivo:c,cicloId:ci.id,nombre:`${c.nombre} — ${ci.nombre}`,gastos:gs});
      });
    });
    return grupos.filter(g=>g.gastos.length>0||g.cicloId);
  };

  return(
  <div style={{fontFamily:"-apple-system,sans-serif",background:"#F0F7EE",minHeight:"100vh",maxWidth:480,margin:"0 auto",paddingBottom:90}}>

    {/* HEADER */}
    <div style={{background:"linear-gradient(135deg,#2D6A4F,#40916C)",color:"#fff",padding:"48px 18px 14px",position:"sticky",top:0,zIndex:10}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <div style={{fontSize:10,opacity:.7,letterSpacing:2,textTransform:"uppercase"}}>Gestor Agrícola</div>
          <div style={{fontSize:21,fontWeight:700,marginTop:2}}>🌱 Jhacson & Harol</div>
        </div>
        {flash&&<div style={{fontSize:11,background:"rgba(255,255,255,.2)",borderRadius:8,padding:"4px 10px",marginTop:6}}>{flash}</div>}
      </div>
      <div style={{display:"flex",gap:5,marginTop:12}}>
        {navItems.map(([v,ic,lb])=>(
          <button key={v} onClick={()=>setVista(v)}
            style={{flex:1,padding:"6px 1px",borderRadius:8,border:"none",cursor:"pointer",fontSize:9,fontWeight:600,
              background:vista===v?"rgba(255,255,255,.95)":"rgba(255,255,255,.15)",
              color:vista===v?"#2D6A4F":"#fff"}}>
            {ic}<br/>{lb}
          </button>
        ))}
      </div>
    </div>

    <div style={{padding:14}}>

      {/* ══ INICIO ══ */}
      {vista==="inicio"&&<>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          {[{s:"Jhacson",c:"#2D6A4F"},{s:"Harol",c:"#40916C"}].map(({s,c})=>(
            <div key={s} style={card}>
              <div style={{fontSize:11,color:"#888",marginBottom:3}}>💼 {s}</div>
              <div style={{fontSize:18,fontWeight:700,color:c}}>{fmt(totSocio(s))}</div>
              <div style={{fontSize:11,color:"#aaa",marginTop:2}}>{gastos.filter(g=>g.socio===s).length} movimientos</div>
            </div>
          ))}
        </div>
        <div style={card}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontWeight:700,color:"#2D6A4F"}}>Total invertido</span>
            <span style={{fontWeight:800,fontSize:17,color:"#1B4332"}}>{fmt(total)}</span>
          </div>
          <div style={{background:"#E8F5E9",borderRadius:8,height:16,overflow:"hidden"}}>
            {total>0&&<div style={{width:`${(totSocio("Jhacson")/total*100).toFixed(1)}%`,
              background:"linear-gradient(90deg,#2D6A4F,#52B788)",height:"100%",
              display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff",fontWeight:700}}>
              {(totSocio("Jhacson")/total*100).toFixed(0)}%
            </div>}
          </div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:4,fontSize:11,color:"#888"}}>
            <span>🟢 Jhacson {total>0?(totSocio("Jhacson")/total*100).toFixed(0):50}%</span>
            <span>🟩 Harol {total>0?(totSocio("Harol")/total*100).toFixed(0):50}%</span>
          </div>
        </div>

        <div style={{fontWeight:700,color:"#2D6A4F",marginBottom:8}}>Por cultivo / ciclo</div>
        {gruposInicio().map(gr=>{
          const t=gr.gastos.reduce((a,g)=>a+g.monto,0);
          const j=gr.gastos.filter(g=>g.socio==="Jhacson").reduce((a,g)=>a+g.monto,0);
          const h=gr.gastos.filter(g=>g.socio==="Harol").reduce((a,g)=>a+g.monto,0);
          return<div key={gr.key} style={{...card,padding:"12px 14px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <span style={{fontSize:22}}>{gr.cultivo.emoji}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,color:"#1B4332",fontSize:14}}>{gr.nombre}</div>
                <div style={{fontSize:11,color:"#aaa"}}>{gr.gastos.length} registros</div>
              </div>
              <div style={{fontWeight:800,color:gr.cultivo.color,fontSize:15}}>{fmt(t)}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
              <div style={{background:"#F0FFF4",borderRadius:8,padding:"7px 10px",borderLeft:"3px solid #2D6A4F"}}>
                <div style={{fontSize:10,color:"#888",marginBottom:2}}>💼 Jhacson</div>
                <div style={{fontWeight:700,color:"#2D6A4F",fontSize:13}}>{fmt(j)}</div>
              </div>
              <div style={{background:"#F0FFF4",borderRadius:8,padding:"7px 10px",borderLeft:"3px solid #52B788"}}>
                <div style={{fontSize:10,color:"#888",marginBottom:2}}>💼 Harol</div>
                <div style={{fontWeight:700,color:"#40916C",fontSize:13}}>{fmt(h)}</div>
              </div>
            </div>
          </div>;
        })}
        {total===0&&<div style={{textAlign:"center",padding:40,color:"#aaa"}}>
          <div style={{fontSize:48}}>🌿</div>
          <div style={{marginTop:8}}>Aún no hay registros.<br/>¡Agrega el primer gasto!</div>
        </div>}
      </>}

      {/* ══ AGREGAR ══ */}
      {vista==="agregar"&&<div style={{background:"#fff",borderRadius:16,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.08)"}}>
        <div style={{fontWeight:700,fontSize:17,color:"#1B4332",marginBottom:18}}>➕ Nuevo Gasto</div>

        <label style={{fontSize:12,color:"#666",fontWeight:600,display:"block",marginBottom:6}}>CULTIVO Y CICLO</label>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:8}}>
          {CULTIVOS.map(c=>{
            const cics=ciclosDeCultivo(c.id);
            const sel=cultivoSel===c.id;
            const ncActual=cicloSel&&sel?cics.find(x=>x.id===cicloSel)?.nombre:null;
            return<button key={c.id} onClick={()=>{setCultivo(c.id);setCicloSel(null);setMostrarFormCiclo(false);}}
              style={{padding:"9px 2px",borderRadius:10,border:`2px solid ${sel?c.color:"#E8F5E9"}`,
                background:sel?c.color+"18":"#fff",cursor:"pointer",fontSize:11,fontWeight:600,
                color:sel?c.color:"#555",lineHeight:1.4,textAlign:"center"}}>
              {c.emoji} {c.nombre}
              {sel&&ncActual&&<div style={{fontSize:9,color:c.color,marginTop:1}}>🌀 {ncActual}</div>}
            </button>;
          })}
        </div>

        {/* Panel de ciclos del cultivo seleccionado */}
        <div style={{background:"#FFFDF0",borderRadius:12,border:"2px solid #D4AC0D",padding:12,marginBottom:14}}>
          <div style={{fontSize:11,color:"#8B6914",fontWeight:700,marginBottom:8}}>

      {/* ══ TAREAS ══ */}

        {tareas.filter(t=>!t.completada&&t.fecha&&(new Date(t.fecha)-new Date())/(1000*60*60*24)<=3&&(new Date(t.fecha)-new Date())>=0).length>0&&

            <div style={{fontWeight:700,color:"#856404",fontSize:13}}>⚠️ Tareas próximas (en 3 días o menos)</div>
            {tareas.filter(t=>!t.completada&&t.fecha&&(new Date(t.fecha)-new Date())/(1000*60*60*24)<=3&&(new Date(t.fecha)-new Date())>=0).map(t=>(
              <div key={t.id} style={{fontSize:12,color:"#856404",marginTop:4}}>• {t.titulo} — {new Date(t.fecha).toLocaleDateString("es-NI",{day:"2-digit",month:"short"})}</div>
            ))}

        {tareas.filter(t=>!t.completada&&t.fecha&&new Date(t.fecha)<new Date()).length>0&&
          <div style={{background:"#FFE5E5",borderRadius:12,padding:"10px 14px",marginBottom:12,borderLeft:"4px solid #E74C3C"}}>
            <div style={{fontWeight:700,color:"#C0392B",fontSize:13}}>🔴 Tareas vencidas</div>
            {tareas.filter(t=>!t.completada&&t.fecha&&new Date(t.fecha)<new Date()).map(t=>(
              <div key={t.id} style={{fontSize:12,color:"#C0392B",marginTop:4}}>• {t.titulo} — {new Date(t.fecha).toLocaleDateString("es-NI",{day:"2-digit",month:"short"})}</div>
            ))}
          </div>
        }
        <button onClick={()=>setMostrarFormTarea(!mostrarFormTarea)}
          style={{width:"100%",padding:13,borderRadius:12,border:"none",marginBottom:12,
            background:"linear-gradient(135deg,#2D6A4F,#52B788)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
          {mostrarFormTarea?"✕ Cancelar":"➕ Nueva tarea / proyecto"}
        </button>
        {mostrarFormTarea&&<div style={{...card,marginBottom:12}}>

          {[["Título / descripción",nuevaTarea.titulo,(v)=>setNuevaTarea({...nuevaTarea,titulo:v}),"text"],
            ["Fecha programada",nuevaTarea.fecha,(v)=>setNuevaTarea({...nuevaTarea,fecha:v}),"date"]].map(([lbl,val,fn,type])=>(
            <div key={lbl} style={{marginBottom:10}}>
              <div style={{fontSize:12,color:"#888",marginBottom:4}}>{lbl}</div>
              <input type={type} value={val} onChange={e=>fn(e.target.value)}
                style={{width:"100%",padding:"9px 12px",borderRadius:9,border:"2px solid #E8F5E9",fontSize:14,outline:"none"}}/>
            </div>

                <button key={v} onClick={()=>setNuevaTarea({...nuevaTarea,categoria:v})}
                  style={{padding:"5px 10px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,
                    background:nuevaTarea.categoria===v?"#2D6A4F":"#E8F5E9",color:nuevaTarea.categoria===v?"#fff":"#555"}}>

            background:"linear-gradient(135deg,#2D6A4F,#52B788)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>

          </button>

        {tareas.filter(t=>!t.completada).length===0&&!mostrarFormTarea&&

        {tareas.filter(t=>!t.completada).sort((a,b)=>a.fecha&&b.fecha?new Date(a.fecha)-new Date(b.fecha):a.fecha?-1:1).map(t=>{
          const cat={finca:"🌿",siembra:"🌱",mantenimiento:"🔧",ganado:"🐄",otro:"📌"};
          const diasRestantes=t.fecha?Math.ceil((new Date(t.fecha)-new Date())/(1000*60*60*24)):null;
          const vencida=diasRestantes!==null&&diasRestantes<0;
          const proxima=diasRestantes!==null&&diasRestantes<=3&&diasRestantes>=0;
          return<div key={t.id} style={{...card,borderLeft:`4px solid ${vencida?"#E74C3C":proxima?"#F5A623":"#52B788"}`,padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

            {expandido===c.id&&<div style={{marginTop:8,borderTop:"1px solid #E8F5E9",paddingTop:8}}>
              {gastos.filter(g=>g.cultivo===c.id).map((g,idx)=>{
                const fecha=new Date(g.fecha).toLocaleDateString("es-NI",{day:"2-digit",month:"short",year:"numeric"});
                const nc=nombreCiclo(g);
                return<div key={g.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                  padding:"7px 9px",marginBottom:3,borderRadius:8,background:idx%2===0?"#F9FFF9":"#fff",borderLeft:`3px solid ${c.color}`}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:12,fontWeight:600,color:"#1B4332"}}>{g.descripcion}{nc&&<span style={{fontSize:10,color:"#8B6914",marginLeft:4}}>🌀{nc}</span>}</div>
                    <div style={{fontSize:11,color:"#aaa"}}>{fecha} · {g.socio}</div>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontWeight:700,color:c.color,fontSize:13}}>{fmt(g.monto)}</span>
                    <button onClick={()=>abrirEditar(g)} style={{background:"#EEF7FF",border:"none",borderRadius:6,padding:"3px 7px",cursor:"pointer",fontSize:12,color:"#2980B9",fontWeight:700}}>✏️</button>
                    <button onClick={()=>borrar(g.id)} style={{background:"none",border:"none",cursor:"pointer",fontSize:13,opacity:.35}}>🗑️</button>
                  </div>
                </div>;
              })}
              <div style={{display:"flex",justifyContent:"space-between",padding:"7px 9px",marginTop:3,background:"#E8F5E9",borderRadius:8,fontWeight:700}}>
                <span style={{color:"#2D6A4F"}}>Total {c.nombre}</span><span style={{color:c.color}}>{fmt(t)}</span>
              </div>
            </div>}
          </div>;
        })}
      </>}

      {/* ══ AJUSTES ══ */}
      {vista==="ajustes"&&<>
        <div style={{background:"#fff",borderRadius:16,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.08)",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:16,color:"#1B4332",marginBottom:6}}>💱 Tipo de Cambio (USD → C$)</div>
          <div style={{fontSize:13,color:"#666",marginBottom:12}}>Se usa para convertir deudas y abonos en dólares a córdobas.</div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <span style={{fontSize:13,color:"#888",whiteSpace:"nowrap"}}>1 USD =</span>
            <input type="number" value={tipoCambio} onChange={e=>saveTipoCambio(parseFloat(e.target.value)||36.50)}
              style={{flex:1,padding:"10px 12px",borderRadius:9,border:"2px solid #95D5B2",fontSize:16,fontWeight:700,color:"#2D6A4F",outline:"none"}}/>
            <span style={{fontSize:13,color:"#888"}}>C$</span>
          </div>
          <div style={{fontSize:11,color:"#aaa",marginTop:8}}>Valor actual: 1 USD = C$ {tipoCambio}</div>
        </div>
        <div style={{background:"#fff",borderRadius:16,padding:18,boxShadow:"0 2px 12px rgba(0,0,0,.08)",marginBottom:14}}>
          <div style={{fontWeight:700,fontSize:16,color:"#1B4332",marginBottom:6}}>💾 Respaldo de Datos</div>
          <div style={{fontSize:13,color:"#666",marginBottom:14}}>Tenés <strong>{gastos.length} registros</strong> guardados.</div>
          <button onClick={exportarJSON} style={{width:"100%",padding:13,borderRadius:11,border:"none",marginBottom:10,background:"linear-gradient(135deg,#2D6A4F,#52B788)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
            💾 Exportar para restaurar (.json)
          </button>
          <button onClick={exportarTXT} style={{width:"100%",padding:13,borderRadius:11,border:"none",marginBottom:10,background:"linear-gradient(135deg,#1B4332,#2D6A4F)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer"}}>
            📄 Exportar para leer (.txt)
          </button>
          <input type="file" accept=".json" ref={importRef} style={{display:"none"}} onChange={e=>{if(e.target.files[0])importar(e.target.files[0]);}}/>
          <button onClick={()=>importRef.current.click()} style={{width:"100%",padding:13,borderRadius:11,border:"2px dashed #95D5B2",background:"#F0FFF4",color:"#2D6A4F",fontSize:15,fontWeight:700,cursor:"pointer"}}>
            📥 Restaurar desde archivo (.json)
          </button>
          {importMsg&&<div style={{marginTop:10,padding:"10px 14px",borderRadius:8,background:importMsg.startsWith("✅")?"#E8F5E9":"#FFF3CD",color:importMsg.startsWith("✅")?"#2D6A4F":"#856404",fontSize:13,fontWeight:600}}>{importMsg}</div>}
        </div>
      </>}

    </div>
  </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
